[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cchat-backend"
version = "1.0.0"
description = "CCHAT Backend - Real chats. Main-character energy."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Django>=5.2.0,<6.0.0",
    "djangorestframework>=3.15.0,<4.0.0",
    "django-cors-headers>=4.3.0,<5.0.0",
    "whitenoise>=6.6.0,<7.0.0",
    "dj-database-url>=2.1.0,<3.0.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "gunicorn>=21.2.0,<27.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-django>=4.8.0",
]
