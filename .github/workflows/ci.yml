name: CI Pipeline

on:
  push:
    branches: [ main, thecchat ]
  pull_request:
    branches: [ main, thecchat ]

jobs:
  backend-test:
    name: Backend Lint, Security & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Django Security & Deployment Check
        env:
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: "ci-dummy-production-ready-secret-key-that-is-over-fifty-chars-long"
          SECURE_SSL_REDIRECT: "False"
        run: |
          python backend/manage.py check --deploy

      - name: Run Backend Tests
        run: |
          python backend/manage.py test apps

  frontend-test:
    name: Frontend Lint, Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Oxlint
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

      - name: Build Application
        run: npm run build
